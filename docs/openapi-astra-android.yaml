openapi: 3.1.0
info:
  title: Astra Cockpit Mobile API
  version: 0.1.0-observed
  description: |
    Reverse-engineered documentation for the Astra Cockpit mobile API.
    This is not an official Astra specification. Schemas are based on static
    analysis of `de.astra_software.astracockpit`, the installed iOS app
    `de.astra-software.astracockpit`, and observed web/API behavior.
    Local Android APKs analyzed: versionName 1.0.14/versionCode 16 and the
    current versionName 1.0.15/versionCode 17. The 1.0.15 build adds a PairIP
    security wrapper but keeps the same HTTP signing and action list.
    Local iOS/macOS wrapper app analyzed:
    `/Applications/astracockpit.app`, bundle version 1.3.

    Live recheck on 2026-11-01: the signed form protocol is unchanged. The
    login identity is the full, case-sensitive Astra Cockpit email address.
    `s_sid = md5(email + md5(password))`. `auth_login` also returns a `data[]`
    overview block. An HTTP 200 with an empty body was observed from one
    residential egress IP while the same account and credentials worked from a
    different egress IP; treat that as provider-side deferral/rate limiting/IP
    filtering, not invalid credentials.

    The installed iOS app uses the same signed form protocol and points at
    `/readyxnet/source/login/csios.php`.
servers:
  - url: https://astra-cloud.com
paths:
  /readyxnet/source/login/csandroid.php:
    post:
      summary: Signed Android API action endpoint
      description: |
        Single form-POST endpoint used for timestamp fetch, login, and data
        actions. Every request includes `s_dv=1`. Every response appends
        `md5(payload)` as the final 32 characters; clients must strip and verify
        that suffix before parsing the payload.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/TimestampRequest"
                - $ref: "#/components/schemas/LoginRequest"
                - $ref: "#/components/schemas/DataRequest"
                - $ref: "#/components/schemas/StreamRequest"
      responses:
        "200":
          description: Checksum-suffixed payload text.
          content:
            text/plain:
              schema:
                type: string
                description: Response payload followed by 32 hex MD5 characters.
  /readyxnet/source/login/csios.php:
    post:
      summary: Signed iOS API action endpoint
      description: |
        Single form-POST endpoint found in the installed iOS/macOS wrapper app
        `de.astra-software.astracockpit` version 1.3. Static disassembly shows
        the same body shape and MD5 signing algorithm as the Android endpoint:
        `s_action`, `s_ts`, `s_cs`, request parameters, and `s_dv=1`.

        Live recheck on 2026-06-21 returned HTTP 200 with an empty body for
        `get_ts`, so this endpoint is documented as app-confirmed but not
        currently usable from the direct local probe.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/TimestampRequest"
                - $ref: "#/components/schemas/LoginRequest"
                - $ref: "#/components/schemas/DataRequest"
                - $ref: "#/components/schemas/StreamRequest"
      responses:
        "200":
          description: Checksum-suffixed payload text or, in the current observed backend state, an empty body.
          content:
            text/plain:
              schema:
                type: string
                description: Response payload followed by 32 hex MD5 characters when the backend returns data.
components:
  schemas:
    TimestampRequest:
      type: object
      required: [s_action, s_ts, s_cs, s_dv]
      properties:
        s_action:
          const: get_ts
        s_ts:
          const: ""
        s_cs:
          type: string
          pattern: "^[a-f0-9]{32}$"
        s_dv:
          const: "1"
    SignedRequestBase:
      type: object
      required: [s_action, s_ts, s_cs, s_dv]
      properties:
        s_action:
          type: string
          enum:
            - auth_login
            - get_verbrauch
            - get_mtr_vb_overview
            - get_mtr_verbrauch
            - get_mtr_vbmed
            - get_mtr_hist
            - get_mtr_autarkie
            - get_mtr_eb
            - get_mtr_lzs
            - get_mtr_inv
            - get_mtr_inv_pdf
            - get_immo_list
            - get_wf
            - lngchg_medium_list
        s_ts:
          type: string
          description: Timestamp returned by `get_ts`.
        s_cs:
          type: string
          pattern: "^[a-f0-9]{32}$"
          description: md5("SNAFU" + s_action + s_ts).
        s_dv:
          const: "1"
    LoginRequest:
      allOf:
        - $ref: "#/components/schemas/SignedRequestBase"
        - type: object
          required: [s_sid, s_immo, s_year, s_med, s_lang, s_mnt, s_datum]
          properties:
            s_action:
              const: auth_login
            s_sid:
              type: string
              pattern: "^[a-f0-9]{32}$"
              description: md5(username + md5(password)).
            s_immo:
              type: string
              default: "-1"
            s_year:
              type: string
            s_med:
              type: string
              default: "1"
            s_lang:
              type: string
              default: de
            s_mnt:
              type: string
              default: "-1"
            s_datum:
              type: string
              default: "-1"
              description: Use YYYY-MM-DD for observed 15-minute daily fields.
    DataRequest:
      allOf:
        - $ref: "#/components/schemas/LoginRequest"
        - type: object
          properties:
            s_action:
              enum:
                - get_verbrauch
                - get_mtr_vb_overview
                - get_mtr_verbrauch
                - get_mtr_vbmed
                - get_mtr_hist
                - get_mtr_autarkie
                - get_mtr_eb
                - get_mtr_lzs
                - get_mtr_inv
                - get_immo_list
                - get_wf
                - lngchg_medium_list
    StreamRequest:
      allOf:
        - $ref: "#/components/schemas/SignedRequestBase"
        - type: object
          required: [s_sid, s_id]
          properties:
            s_action:
              const: get_mtr_inv_pdf
            s_sid:
              type: string
              pattern: "^[a-f0-9]{32}$"
            s_id:
              type: string
    AuthLoginPayload:
      type: object
      properties:
        auth:
          type: string
          enum: ["0", "1"]
        comp_id:
          type: string
        comp_name:
          type: string
        user:
          type: string
        auft:
          type: string
        immo_sel:
          type: string
        is_mieter:
          type: string
          enum: ["0", "1"]
        is_t1t2:
          type: string
          enum: ["0", "1"]
        med_list:
          type: array
          items:
            $ref: "#/components/schemas/Medium"
        standort_list:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        data:
          type: array
          description: |
            Current overview rows, same shape and metric keys as
            `get_mtr_vb_overview`. Observed as six rows on 2026-11-01.
          items:
            $ref: "#/components/schemas/OverviewRow"
    Medium:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        img:
          type: string
    Location:
      type: object
      properties:
        id:
          type: string
          description: Hierarchical location id, e.g. 3^root, 4^building, 5^tenant, or -1 separator.
        name:
          type: string
        country:
          type: string
    LatestMeterReadingsPayload:
      type: object
      properties:
        auth:
          type: string
          enum: ["0", "1"]
        data:
          type: array
          items:
            $ref: "#/components/schemas/LatestMeterReadingRow"
    LatestMeterReadingRow:
      type: object
      description: Observed `get_mtr_lzs` row.
      properties:
        v01:
          type: string
          description: Meter identifier/label, e.g. `<meter-id>/0` or `ZT1_<id>/0`.
        v02:
          type: string
          description: Cumulative meter stand in `v03`; lifetime counter including prior years.
        v03:
          type: string
          description: Unit, normally `kWh`.
        v04:
          type: string
          description: |
            Consumption for the selected period: current year by default,
            month with `s_mnt`, or day with `s_datum`. Not a generic interval
            delta.
        v05:
          type: string
          description: Reading date, provider-local `DD.MM.YYYY`.
        v06:
          type: string
          description: Channel label, e.g. `Strom VGB`, `Strom T1 (Netzbezug)`, `Strom T2 (Objektbezug)`.
        v07:
          type: string
          description: Account/order label.
    EnergyBalancePayload:
      type: object
      description: Observed `get_mtr_eb` payload.
      properties:
        auth:
          type: string
          enum: ["0", "1"]
        data:
          type: array
          items:
            type: object
            properties:
              _lvb_lbl:
                type: string
                description: |
                  12 comma-separated month labels (`Jan`...`Dez`) for a
                  monthly request, or 24 hourly labels (`01:00`...`00:00`) for
                  a daily request.
              _lvb_lbl_14h:
                type: string
                description: 96 comma-separated provider-local interval-end labels (`00:15`...`00:00`) for a daily request.
              _lvb_ttl:
                type: string
                description: Series names, e.g. Gesamtbezug,Netzbezug,Objektbezug,PV-Bezug,Batterie-Bezug.
              _lvb_vll:
                type: string
                description: |
                  Semicolon-separated channel series matching `_lvb_ttl`.
                  Monthly requests contain 12 values per channel; daily
                  requests contain 24 hourly values per channel.
              _lvb_vll_14h:
                type: string
                description: Semicolon-separated 96-value quarter-hour interval-kWh series matching `_lvb_ttl`.
              _lvb_clr:
                type: string
                description: Comma-separated chart colors matching `_lvb_ttl`.
              _lvb_eh:
                type: string
                example: kWh
              _vb_ttl:
                type: string
                description: Grid/object/battery channel labels, e.g. Netzbezug,Objektbezug,Batterie-Bezug.
              _vb_vll:
                type: string
                description: Semicolon-separated monthly/hourly series matching `_vb_ttl`.
              _vb_vll_14h:
                type: string
                description: Semicolon-separated 96-value quarter-hour series matching `_vb_ttl`.
              _vbt2r_ttl:
                type: string
                description: Tariff split labels, e.g. Netzbezug,Objektbezug.
              _vbt2r_vll:
                type: string
                description: Semicolon-separated monthly/hourly tariff split values matching `_vbt2r_ttl`.
              _vbt2r_vll_14h:
                type: string
                description: Semicolon-separated 96-value quarter-hour tariff split values.
              _lt2rvb_ttl:
                type: string
                description: Tariff split labels, e.g. Gesamtbezug,Netzbezug,Objektbezug.
              _lt2rvb_vll:
                type: string
                description: Semicolon-separated monthly/hourly tariff split values matching `_lt2rvb_ttl`.
              _lt2rvb_vll_14h:
                type: string
                description: Semicolon-separated 96-value quarter-hour tariff split values.
              _ez_ttl:
                type: string
                description: PV feed/battery/object delivery labels.
              _ez_vll:
                type: string
                description: Semicolon-separated monthly/hourly PV feed/battery/object delivery values.
              _ez_vll_14h:
                type: string
                description: Semicolon-separated 96-value quarter-hour PV delivery values.
              _lez_ttl:
                type: string
                description: PV delivery series labels, e.g. PV-Gesamtlieferung,PV-Netzlieferung,Batterie-Ladung,PV-Objektlieferung.
              _lez_vll:
                type: string
                description: Semicolon-separated monthly/hourly PV delivery values matching `_lez_ttl`.
              _lez_vll_14h:
                type: string
                description: Semicolon-separated 96-value quarter-hour PV delivery values.
              _vb_lbl:
                type: string
                description: Monthly or hourly labels for the combined consumption chart.
              _vb_lbl_14h:
                type: string
                description: 96 provider-local quarter-hour labels for the combined consumption chart.
              _vb_vll_14h:
                type: string
                description: Semicolon-separated provider-local quarter-hour values for the combined consumption chart.
    AutarkyPayload:
      type: object
      description: Observed `get_mtr_autarkie` payload.
      properties:
        auth:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              _lvb_ttl:
                type: string
                example: Netzbezug,PV-Bezug,Batterie-Bezug
              _lvb_vll:
                type: string
                description: Three comma-separated kWh values for the selected period.
              _lvb_eh:
                type: string
                example: kWh
              _lvb_clr:
                type: string
    HistoryPayload:
      type: object
      description: Observed `get_mtr_hist` payload.
      properties:
        auth:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              _lvb_ttl:
                type: string
                description: Gesamt,Sommer (April - September),Winter (Oktober - März),Wochentage,Wochenenden
              _lvb_vll:
                type: string
                description: Five comma-separated 24-value hourly profiles.
              _lvb_lbl:
                type: string
                description: 24 hourly labels.
              _lvb_eh:
                type: string
              _lvb_clr:
                type: string
    MonthlyMediumPayload:
      type: object
      description: Observed `get_mtr_vbmed` payload.
      properties:
        auth:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              _hvb_ttl:
                type: string
                description: Gesamtbezug,Netzbezug,Objektbezug,PV-Bezug,Batterie-Bezug
              _hvb_vll:
                type: string
                description: Semicolon-separated channel series; 12 monthly, 24 hourly or 96 quarter-hour values per channel.
              _hvb_vll_14h:
                type: string
                description: Semicolon-separated 96-value quarter-hour series.
              _hvbt2r_ttl:
                type: string
                description: Gesamtbezug,Netzbezug,Objektbezug
              _hvbt2r_vll:
                type: string
                description: Semicolon-separated tariff split series.
              _hvbt2r_vll_14h:
                type: string
                description: Semicolon-separated quarter-hour tariff split series.
              _hvbc_ttl:
                type: string
                description: Netzbezug,Objektbezug,Batterie-Bezug; observed zero for the tenant account.
              _hvbc_vll:
                type: string
              _hvbct2r_ttl:
                type: string
                description: Netzbezug,Objektbezug; observed zero for the tenant account.
              _hvbct2r_vll:
                type: string
              _vb_ttl:
                type: string
              _vb_vll:
                type: string
              _hvb_eh:
                type: string
              _hvb_clr:
                type: string
    NonTenantConsumptionPayload:
      type: object
      description: Observed `get_verbrauch` payload.
      properties:
        auth:
          type: string
        vb_eh:
          type: string
        vb_leg:
          type: array
          items:
            type: object
            properties:
              LJ:
                type: string
              VJ:
                type: string
        vb_ly:
          type: array
          description: One object with `v01`...`v12` previous-year monthly values.
          items:
            type: object
            additionalProperties:
              type: string
        vb_vy:
          type: array
          description: One object with `v01`...`v12` current-year monthly values.
          items:
            type: object
            additionalProperties:
              type: string
        vb_x:
          type: array
          description: One object with `v01`...`v12` month numbers.
          items:
            type: object
            additionalProperties:
              type: integer
    InvoiceRow:
      type: object
      description: |
        Observed `get_mtr_inv` row. `DOCS` is encoded as
        `key=value;key=value:...`; the `url` value is the `s_id` handle for
        `get_mtr_inv_pdf`.
      properties:
        TITEL:
          type: string
        DATUM:
          type: string
        SUM:
          type: string
          example: 123,45 EUR
        DOCS:
          type: string
          description: |
            Colon-separated documents; each document is semicolon-separated
            key/value pairs. Observed keys: Nummer, Datum, Betrag, Fälligkeit,
            bezahlt am, url.
    OverviewRow:
      type: object
      description: |
        One `get_mtr_vb_overview` / `auth_login.data` row. `v01` is a stable
        metric key, `v02` the formatted numeric value and `v03` the unit.
      properties:
        v01:
          type: string
          enum:
            - str_mtr_vbo_vb_strom_gesbez
            - str_mtr_vbo_vb_strom_t1
            - str_mtr_vbo_strom_t2
            - str_mtr_vbo_vb_strom_pv
            - str_mtr_vbo_vmco_strom_pv
            - str_mtr_vbo_autarkiegrad
        v02:
          type: string
          description: Formatted number; parse with decimal point/comma handling.
        v03:
          type: string
          example: kWh
    OverviewPayload:
      type: object
      properties:
        auth:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/OverviewRow"
    ConsumptionSeriesPayload:
      type: object
      properties:
        auth:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              _vb_vll_vy:
                type: string
              _vb_vll_ly:
                type: string
              _vb_x:
                type: string
              _vb_ttl:
                type: string
              _vb_eh:
                type: string
    InvoicePayload:
      type: object
      properties:
        auth:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceRow"
    InvoicePdfPayload:
      type: object
      properties:
        auth:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              pdfUri:
                type: string
                description: Document path segment.
              alias:
                type: string
                description: Tenant alias used in `https://astra-cloud.com/{alias}/readyxnet/source/userdocs/{pdfUri}`.
    MediumListPayload:
      type: object
      properties:
        auth:
          type: string
        med_list:
          type: array
          items:
            $ref: "#/components/schemas/Medium"
    LocationListPayload:
      type: object
      properties:
        auth:
          type: string
        standort_list:
          type: array
          items:
            $ref: "#/components/schemas/Location"
    WeatherPayload:
      type: object
      properties:
        auth:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              _vll1:
                type: string
              _vll2:
                type: string
              _vll3:
                type: string
              _vll4:
                type: string
              _vll5:
                type: string
              _vll6:
                type: string
              _lbl6:
                type: string
              _ttl1:
                type: string
              _ttl1_1:
                type: string
              _ttl2:
                type: string
              _ttl3:
                type: string
              _ttl4:
                type: string
              _ttl5:
                type: string
              _ttl6:
                type: string
